services:
  aprovauto-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: aprovauto-ai:latest
    pull_policy: build
    container_name: aprovauto-ai-runner
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./.env
    environment:
      - AGENT_SLUG=aprovauto-ai
      - AGENT_CHANNEL=whatsapp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aprovauto-ai.rule=Host(`aprovauto-ai.vittalweb.com`)"
      - "traefik.http.routers.aprovauto-ai.entrypoints=websecure"
      - "traefik.http.routers.aprovauto-ai.tls.certresolver=letsencrypt"
      - "traefik.http.services.aprovauto-ai.loadbalancer.server.port=3000"
    networks:
      - dokploy-network
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
